# Java 210 — single-host nginx config for kodedlabs.
#
# HTTPS on the standard port 443, landing page at "/", each Spring Boot app
# behind its own path prefix. Every app has server.servlet.context-path set
# to match its prefix below (see each app's application.properties), so
# nginx passes each request straight through unmodified — no rewriting.
#
# Plain HTTP is on 8080, not 80: this box already has a Docker container
# (ship-cli-nginx-1, a different project) bound to 0.0.0.0:80, so the host's
# own nginx package can't use it. 8080 only exists to redirect to HTTPS and
# to serve the Let's Encrypt renewal challenge (reached via one additive
# redirect location added to ship-cli/nginx.conf, since Let's Encrypt's
# HTTP-01 validation always hits port 80 — see DEPLOY.md's HTTPS section).
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/java210
#   sudo ln -s /etc/nginx/sites-available/java210 /etc/nginx/sites-enabled/java210
#   sudo mkdir -p /var/www/java210 && sudo cp -r landing/* /var/www/java210/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 8080 && sudo ufw allow 443
#
# Requires a cert already issued at
# /etc/letsencrypt/live/java-210.kodedlabs.com/ — see DEPLOY.md "HTTPS".
#
# Each app must be running locally on the port referenced below — see
# DEPLOY.md for the systemd unit files that keep them running.

server {
    listen 8080;
    listen [::]:8080;
    server_name java-210.kodedlabs.com;

    # Let's Encrypt HTTP-01 challenge for renewals — must stay reachable
    # over plain HTTP indefinitely.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name java-210.kodedlabs.com;

    ssl_certificate     /etc/letsencrypt/live/java-210.kodedlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/java-210.kodedlabs.com/privkey.pem;

    root /var/www/java210;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /serp-insights/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vehicle-tracker/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ayo/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dead-or-wounded/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
