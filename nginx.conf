# Java 210 — single-host nginx config for kodedlabs.
#
# One origin, port 8080: the landing page at "/", each Spring Boot app behind
# its own path prefix. Every app has server.servlet.context-path set to
# match its prefix below (see each app's application.properties), so nginx
# passes each request straight through unmodified — no path rewriting needed.
#
# Port 8080, not 80: this box already has a Docker container (ship-cli-nginx-1,
# a different project) bound to 0.0.0.0:80, so the host's own nginx package
# can't use it. Site is reachable at java-210.kodedlabs.com:8080.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/java210
#   sudo ln -s /etc/nginx/sites-available/java210 /etc/nginx/sites-enabled/java210
#   sudo mkdir -p /var/www/java210 && sudo cp -r landing/* /var/www/java210/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx   # (or enable --now, first time)
#   sudo ufw allow 8080
#
# Each app must be running locally on the port referenced below — see
# DEPLOY.md for the systemd unit files that keep them running.
#
# See DEPLOY.md "HTTPS" section for the certbot + 443 server block steps —
# this file only has the pieces needed *before* a cert exists.

server {
    listen 8080;
    listen [::]:8080;
    server_name java-210.kodedlabs.com;

    root /var/www/java210;
    index index.html;

    # Let's Encrypt HTTP-01 challenge, reached via a redirect added to the
    # ship-cli Docker container's nginx (which owns port 80 on this box) —
    # see ship-cli/nginx.conf's /.well-known/acme-challenge/ location.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /serp-insights/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vehicle-tracker/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ayo/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dead-or-wounded/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
