# Java 210 — single-host nginx config for kodedlabs.
#
# One origin, port 80: the landing page at "/", each Spring Boot app behind
# its own path prefix. Every app has server.servlet.context-path set to
# match its prefix below (see each app's application.properties), so nginx
# passes each request straight through unmodified — no path rewriting needed.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/java210
#   sudo ln -s /etc/nginx/sites-available/java210 /etc/nginx/sites-enabled/java210
#   sudo rm -f /etc/nginx/sites-enabled/default   # avoid the default site clashing on :80
#   sudo mkdir -p /var/www/java210 && sudo cp -r landing/* /var/www/java210/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Each app must be running locally on the port referenced below — see
# DEPLOY.md for the systemd unit files that keep them running.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # replace with your domain once you point one at this IP

    root /var/www/java210;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /serp-insights/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vehicle-tracker/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ayo/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dead-or-wounded/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
