<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead or Wounded</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt">
        <div class="scanlines" aria-hidden="true"></div>

        <main class="terminal">
            <div class="title-bar">
                <span class="title-dots"><i></i><i></i><i></i></span>
                <span class="title-text">session: dead-or-wounded // 4-digit cipher</span>
            </div>

            <div class="terminal-body">
                <pre class="ascii-heading" aria-hidden="true">DEAD OR WOUNDED</pre>
                <p class="subtitle">// crack the 4-digit cipher before the channel closes.</p>

                <div class="boot-log" id="boot-log"></div>

                <div class="game-area" id="game-area" hidden>
                    <div class="hud">
                        <div class="hud-row">
                            <span class="hud-label">TIME</span>
                            <span class="timer-bar" id="timer-bar"></span>
                            <span class="timer-num" id="timer">60</span>
                        </div>
                        <div class="hud-row">
                            <span class="hud-label">ATTEMPTS</span>
                            <span class="hud-value" id="attempts">0</span>
                        </div>
                    </div>

                    <form id="guess-form" autocomplete="off">
                        <span class="prompt">GUESS&gt;</span>
                        <input
                            id="guess-input"
                            type="text"
                            inputmode="numeric"
                            pattern="\d{4}"
                            maxlength="4"
                            placeholder="____"
                            aria-label="4-digit guess"
                            disabled
                        >
                        <button type="submit" id="guess-submit" disabled>ENTER</button>
                    </form>

                    <p class="error" id="error"></p>

                    <div class="history" id="history"></div>
                </div>

                <div class="game-over" id="game-over" hidden>
                    <p id="game-over-message"></p>
                </div>

                <button id="start" class="start-button">[ run new_game.sh ]</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
